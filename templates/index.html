<h1>Welcome to MyPokemon Collection</h1>
<form action="/cards" method="get">
    <label for="extension">Sélectionnez une extension:</label>
    <select name="extension" id="extension">
        {% for ext in extensions %}
            <option value="{{ ext }}">{{ ext }}</option>
        {% endfor %}
    </select>
    <button type="submit">Voir les cartes</button>
</form>
{% endblock %}
