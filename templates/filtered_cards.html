<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cartes Pokémon</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1>Cartes Pokémon - {{ extension }}</h1>
    <form method="get" action="/cards">
        <input type="hidden" name="extension" value="{{ extension }}">
        {% for rarity in rarities %}
            <label>
                <input type="checkbox" name="rarities" value="{{ rarity }}" checked>
                {{ rarity }}
            </label>
        {% endfor %}
        <button type="submit">Filtrer</button>
    </form>

    <!-- Scrollable Table Container -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nom</th>
                    <th>Type</th>
                    <th>Rareté</th>
                    <th>Image</th>
                </tr>
            </thead>
            <tbody>
                {% for card in cards.itertuples() %}
                    <tr>
                        <td>{{ card.id }}</td>
                        <td>{{ card.Name }}</td>
                        <td>{{ card.type }}</td>
                        <td>{{ card.rareté }}</td>
                        <td>
                            <button class="view-image-btn" data-id="{{ card.id }}">Voir</button>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <div id="image-container">
        <img id="card-image" src="" alt="Card Image" style="display:none;">
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
